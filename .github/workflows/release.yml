name: release-gate

on:
  pull_request:
  push:
    branches: [master]
    # GitHub ref filters are globs, not regular expressions. The immutable
    # release job below performs the exact SemVer check before publication.
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  full-tests:
    name: full tests / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      # Query execution deliberately disables extension auto-install. Seed the
      # exact DuckDB build's httpfs extension during the networked setup phase
      # so the sandbox tests exercise the intended offline LOAD path.
      - run: python -c 'import duckdb; connection = duckdb.connect(); connection.execute("INSTALL httpfs"); connection.close()'
      # No path argument: root characterization tests and package tests are
      # both mandatory and cannot be bypassed by the release workflow.
      - run: python -m pytest -q

  dependency-bounds:
    name: dependencies / ${{ matrix.set }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        set: [minimum, latest-supported]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-min.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - if: matrix.set == 'minimum'
        run: |
          python -m pip install -r requirements-min.txt
          python -m pip install --no-deps -e .
      - if: matrix.set == 'latest-supported'
        run: python -m pip install --upgrade --upgrade-strategy eager -e .
      - run: python -m pip check
      - run: python -c 'import duckdb; connection = duckdb.connect(); connection.execute("INSTALL httpfs"); connection.close()'
      - run: python -m pytest -q

  cloud-storage-contract:
    name: cloud storage adapters / ${{ matrix.set }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        set: [minimum, latest-supported]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # The exact pandas 2.1.0 lower bound publishes Python 3.10 wheels;
          # keep this minimum-SDK contract aligned with dependency-bounds.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-min.txt
            requirements-cloud-min.txt
      - run: python -m pip install -r requirements-dev.txt
      - if: matrix.set == 'minimum'
        run: |
          python -m pip install -r requirements-min.txt -r requirements-cloud-min.txt
          python -m pip install --no-deps -e .
      - if: matrix.set == 'latest-supported'
        run: python -m pip install --upgrade --upgrade-strategy eager -e '.[all-cloud]'
      - run: python -m pip check
      # Audit the environment actually exercised by each cloud matrix leg,
      # including optional SDKs and pinned release tooling.  The project is
      # editable here and not yet present on PyPI, so exclude that one local
      # distribution while retaining vulnerability failures for dependencies.
      - run: >-
          python -m pip_audit --local --skip-editable
          --progress-spinner off
      # These tests exercise provider-native conditional create, sealed reads,
      # range fencing, and credential boundaries with deterministic SDK mocks.
      # Installing every extra makes importorskip a test failure in practice.
      - run: >-
          python -m pytest -q
          supertable/storage/tests
          supertable/tests/test_rbac_write_storage_regressions.py
          supertable/tests/test_mcp_sdk_production_boundaries.py

  mirror-conformance:
    name: Delta and Iceberg external conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install 'pip==26.2.1'
      - run: python -m pip install -e . 'pytest==9.1.1' 'pytest-asyncio==1.3.0' 'fakeredis==2.35.1' 'deltalake==1.2.0' 'pyiceberg==0.10.0'
      - run: python -c 'import deltalake; from pyiceberg.table import StaticTable'
      # These tests open and scan generated artifacts with independent readers;
      # importorskip is useful locally but these pinned installs make a skip a
      # release-gate failure.
      - run: python -m pytest -q -m integration supertable/tests/test_release_audit_storage_mirroring.py

  quality-security:
    name: lint, types, and dependency security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # The reviewed mypy baseline is intentionally verbatim. Mypy 2.3
          # attributes two diagnostics to adjacent lines differently under
          # Python 3.10 and 3.12, so pin its interpreter as well as mypy itself.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-min.txt
            requirements-cloud-min.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -m ruff check supertable tests check_mypy_baseline.py
      # The positional target is deliberate: the baseline checker rejects a
      # narrowed config or module-level suppression and inventories every
      # shipped production module, including all release-critical paths.
      - run: python check_mypy_baseline.py supertable
      - run: python -m bandit -q -r supertable -lll
      # No advisory exceptions are accepted: both supported ranges and exact
      # lower bounds must resolve to vulnerability-clean dependency sets.
      - name: Audit supported dependency ranges
        run: >-
          python -m pip_audit --strict
          --progress-spinner off
          -r requirements.txt
      - name: Audit exact minimum runtime and cloud dependencies
        run: >-
          python -m pip_audit --strict
          --progress-spinner off
          -r requirements-min.txt
          -r requirements-cloud-min.txt
      - name: Audit pinned release tooling
        run: >-
          python -m pip_audit --strict
          --progress-spinner off
          -r requirements-dev.txt

  artifact:
    name: build and install immutable artifacts
    needs: [full-tests, dependency-bounds, cloud-storage-contract, mirror-conformance, quality-security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify tag identifies this versioned source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$(git cat-file -t "${GITHUB_REF}")" = tag
          test "$(git rev-list -n 1 "${GITHUB_REF}")" = "${GITHUB_SHA}"
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          # Verify the signature against the release maintainer's pinned SSH
          # signing key. This is deterministic even when GitHub has not linked
          # that public key to account-level signature metadata.
          ALLOWED_SIGNERS="${GITHUB_WORKSPACE}/.github/release_allowed_signers"
          test "$(ssh-keygen -lf "${ALLOWED_SIGNERS}" -E sha256 | awk '{print $2}')" = \
            "SHA256:sc3IvJewQy3tS7edt21CrS6Cx9oZymArvXs4Fj/s6kk"
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="${ALLOWED_SIGNERS}" \
            verify-tag "${GITHUB_REF}"
      - run: python -m pip install 'pip==26.2.1' 'build==1.5.0' 'twine==6.2.0'
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and inspect wheel in a clean environment
        run: |
          python -m venv /tmp/supertable-artifact-test
          /tmp/supertable-artifact-test/bin/python -m pip install 'pip==26.2.1'
          /tmp/supertable-artifact-test/bin/python -m pip install dist/*.whl
          /tmp/supertable-artifact-test/bin/python -m pip check
          SMOKE_CWD=$(mktemp -d "${RUNNER_TEMP}/supertable-wheel-cwd.XXXXXX")
          cd "${SMOKE_CWD}"
          /tmp/supertable-artifact-test/bin/python - <<'PY'
          import importlib
          import importlib.metadata
          import importlib.resources
          import os
          from pathlib import Path
          import sys
          before = os.getcwd()
          import supertable
          for module in (
              "supertable.audit.privileged_worker",
              "supertable.recovery.redis_rebuild",
              "supertable.demo.quickstart.controller",
              "supertable.demo.webshop.generate",
              "supertable.demo.webshop.load",
              "supertable.demo.webshop.topup",
              "supertable.demo.medcenter.generate",
              "supertable.demo.medcenter.load",
              "supertable.demo.medcenter.transform",
              "supertable.demo.medcenter.quality",
              "supertable.demo.medcenter.export_accounting",
              "supertable.demo.medcenter.run",
          ):
              importlib.import_module(module)
          assert os.getcwd() == before
          assert Path(supertable.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          metadata = importlib.metadata.metadata("supertable")
          assert metadata["License-Expression"] == "LicenseRef-FSL-1.1-ALv2"
          assert metadata.get_all("License-File") == ["LICENSE"]
          assert supertable.__version__ == metadata["Version"]
          requirements = metadata.get_all("Requires-Dist", [])
          assert not any(value.lower().startswith("supertable") for value in requirements)
          assert not any(value.lower().startswith("setuptools") for value in requirements)
          polars_requirements = [
              value.replace(" ", "")
              for value in requirements
              if value.lower().startswith("polars")
          ]
          assert polars_requirements == ["polars<2.0,>=1.36.1"]
          pyarrow_requirements = [
              value.replace(" ", "")
              for value in requirements
              if value.lower().startswith("pyarrow")
          ]
          assert pyarrow_requirements == ["pyarrow<24,>=23.0.1"]
          normalized_requirements = {value.replace(" ", "") for value in requirements}
          assert 'azure-storage-blob<13.0,>=12.26.0;extra=="azure"' in normalized_requirements
          assert 'google-cloud-storage<4.0,>=3.1.0;extra=="gcp"' in normalized_requirements
          assert importlib.resources.files("supertable.demo").joinpath("README.md").is_file()
          medcenter = importlib.resources.files("supertable.demo.medcenter")
          assert medcenter.joinpath("annotations.json").is_file()
          assert medcenter.joinpath("demo_queries.md").is_file()
          PY
      - name: Install and inspect sdist in a clean environment
        run: |
          python -m venv /tmp/supertable-sdist-test
          /tmp/supertable-sdist-test/bin/python -m pip install 'pip==26.2.1'
          /tmp/supertable-sdist-test/bin/python -m pip install dist/*.tar.gz
          /tmp/supertable-sdist-test/bin/python -m pip check
          SMOKE_CWD=$(mktemp -d "${RUNNER_TEMP}/supertable-sdist-cwd.XXXXXX")
          cd "${SMOKE_CWD}"
          /tmp/supertable-sdist-test/bin/python - <<'PY'
          import importlib
          import importlib.metadata
          import importlib.resources
          import os
          from pathlib import Path
          import sys
          before = os.getcwd()
          import supertable
          for module in (
              "supertable.audit.privileged_worker",
              "supertable.recovery.redis_rebuild",
              "supertable.demo.quickstart.controller",
              "supertable.demo.webshop.generate",
              "supertable.demo.webshop.load",
              "supertable.demo.webshop.topup",
              "supertable.demo.medcenter.generate",
              "supertable.demo.medcenter.load",
              "supertable.demo.medcenter.transform",
              "supertable.demo.medcenter.quality",
              "supertable.demo.medcenter.export_accounting",
              "supertable.demo.medcenter.run",
          ):
              importlib.import_module(module)
          assert os.getcwd() == before
          assert Path(supertable.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          metadata = importlib.metadata.metadata("supertable")
          assert metadata["License-Expression"] == "LicenseRef-FSL-1.1-ALv2"
          assert metadata.get_all("License-File") == ["LICENSE"]
          assert supertable.__version__ == metadata["Version"]
          requirements = metadata.get_all("Requires-Dist", [])
          assert not any(value.lower().startswith("supertable") for value in requirements)
          assert not any(value.lower().startswith("setuptools") for value in requirements)
          polars_requirements = [
              value.replace(" ", "")
              for value in requirements
              if value.lower().startswith("polars")
          ]
          assert polars_requirements == ["polars<2.0,>=1.36.1"]
          pyarrow_requirements = [
              value.replace(" ", "")
              for value in requirements
              if value.lower().startswith("pyarrow")
          ]
          assert pyarrow_requirements == ["pyarrow<24,>=23.0.1"]
          normalized_requirements = {value.replace(" ", "") for value in requirements}
          assert 'azure-storage-blob<13.0,>=12.26.0;extra=="azure"' in normalized_requirements
          assert 'google-cloud-storage<4.0,>=3.1.0;extra=="gcp"' in normalized_requirements
          assert importlib.resources.files("supertable.demo").joinpath("README.md").is_file()
          medcenter = importlib.resources.files("supertable.demo.medcenter")
          assert medcenter.joinpath("annotations.json").is_file()
          assert medcenter.joinpath("demo_queries.md").is_file()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    name: protected trusted publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [artifact]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/supertable/
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
