name: Secret scan

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history with digest-pinned Gitleaks
        run: |
          gitleaks_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            --output "${gitleaks_dir}/gitleaks_8.30.1_linux_x64.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${gitleaks_dir}/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip \
            --file "${gitleaks_dir}/gitleaks_8.30.1_linux_x64.tar.gz" \
            --directory "${gitleaks_dir}" gitleaks
          "${gitleaks_dir}/gitleaks" git --redact --verbose --no-banner .
