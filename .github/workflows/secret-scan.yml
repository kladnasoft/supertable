name: Secret scan

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commits introduced by this event with digest-pinned Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          gitleaks_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            --output "${gitleaks_dir}/gitleaks_8.30.1_linux_x64.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${gitleaks_dir}/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip \
            --file "${gitleaks_dir}/gitleaks_8.30.1_linux_x64.tar.gz" \
            --directory "${gitleaks_dir}" gitleaks

          sha_pattern='^[0-9a-f]{40}$'
          zero_sha='0000000000000000000000000000000000000000'
          case "${EVENT_NAME}" in
            pull_request)
              if ! [[ "${PR_BASE_SHA}" =~ ${sha_pattern} && "${PR_HEAD_SHA}" =~ ${sha_pattern} ]]; then
                echo "ERROR: pull-request secret scan received invalid commit identifiers." >&2
                exit 2
              fi
              scan_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              if ! [[ "${PUSH_BEFORE}" =~ ${sha_pattern} && "${EVENT_SHA}" =~ ${sha_pattern} ]]; then
                echo "ERROR: push secret scan received invalid commit identifiers." >&2
                exit 2
              fi
              if [[ "${PUSH_BEFORE}" == "${zero_sha}" ]]; then
                base_sha="$(git merge-base "${EVENT_SHA}" refs/remotes/origin/master)"
                if ! [[ "${base_sha}" =~ ${sha_pattern} ]]; then
                  echo "ERROR: cannot determine the new branch's merge-base." >&2
                  exit 2
                fi
                scan_range="${base_sha}..${EVENT_SHA}"
              else
                scan_range="${PUSH_BEFORE}..${EVENT_SHA}"
              fi
              ;;
            *)
              echo "ERROR: unsupported secret-scan event: ${EVENT_NAME}" >&2
              exit 2
              ;;
          esac

          "${gitleaks_dir}/gitleaks" git --redact --verbose --no-banner \
            --log-opts="${scan_range}" .
